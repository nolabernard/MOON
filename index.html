<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOON · CRM</title><style>
:root{font-family:Inter,system-ui,Arial;background:#0b1020;color:#e8ecf7}*{box-sizing:border-box}body{margin:0}header{padding:22px 5%;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #29314b}h1{margin:0;font-size:26px}h2{font-size:20px}button,input,select,textarea{font:inherit;border-radius:9px;padding:10px;border:1px solid #39445f;background:#141c31;color:#f4f6ff}button{cursor:pointer}button.primary{background:#7c6bfa;border:0;color:white;font-weight:700}button:hover{filter:brightness(1.2)}main{max-width:1450px;margin:auto;padding:24px 5%}.nav{display:flex;gap:8px;flex-wrap:wrap}.nav button.active{background:#7c6bfa}.metrics{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}.metric,.panel,.lane,.op{background:#151d33;border:1px solid #2b3653;border-radius:14px;padding:17px}.metric span,.muted{color:#a8b3cd}.metric strong{display:block;font-size:26px;margin:10px 0}.toolbar{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center;margin:22px 0}.board{display:grid;grid-template-columns:repeat(6,minmax(180px,1fr));gap:10px;overflow-x:auto}.lane{min-height:260px;padding:12px}.lane h3{font-size:13px}.op{padding:12px;margin:10px 0;cursor:grab}.op:hover{border-color:#8d80ff}.op small{color:#a8b3cd}.op b{display:block;margin-bottom:6px}.op p{margin:6px 0}.list{display:grid;gap:10px}.item{display:flex;justify-content:space-between;gap:12px;align-items:center;flex-wrap:wrap;padding:13px;border-bottom:1px solid #303a55}.item:last-child{border:0}dialog{background:#111a2d;color:#f2f5ff;border:1px solid #465173;border-radius:16px;max-width:750px;width:94%;max-height:90vh;overflow:auto}dialog::backdrop{background:#030713c9}form{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}label{display:grid;gap:5px;font-size:13px;color:#b8c2db}label.wide{grid-column:1/-1}textarea{min-height:80px}form footer{grid-column:1/-1;display:flex;justify-content:flex-end;gap:8px}#timeline{margin-top:15px}.event{border-left:2px solid #766bf0;padding:5px 15px;margin:10px 0}#notice{color:#fbbf24}.pill{background:#27314d;border-radius:99px;padding:3px 8px;font-size:12px}a{color:#b4aaff}@media(max-width:850px){.metrics{grid-template-columns:repeat(2,1fr)}.board{grid-template-columns:repeat(6,210px)}form{grid-template-columns:1fr}}
</style></head><body>
<header><div><h1>☾ MOON</h1><div class="muted">ESPI Executive · Pilotage commercial</div></div><div class="nav"><button id="nav-dashboard" onclick="view='dashboard';render()">Accueil</button><button id="nav-board" onclick="view='board';render()">Pipeline</button><button id="nav-list" onclick="view='list';render()">Opportunités</button></div></header>
<main><div class="toolbar"><div><button class="primary" onclick="newOp()">+ Nouvelle opportunité</button> <button onclick="exportData()">Exporter JSON</button> <button onclick="document.getElementById('import').click()">Importer JSON</button><input type="file" id="import" accept=".json" hidden onchange="importData(event)"></div><div><select id="period" onchange="render()"><option value="all">Toutes périodes</option><option value="month">Ce mois</option><option value="year">Cette année</option></select> <select id="tax" onchange="render()"><option value="ht">Montants HT</option><option value="ttc">Montants TTC</option></select></div></div><div id="notice"></div><div id="content"></div></main>
<dialog id="editor"><h2 id="editTitle">Opportunité</h2><form id="opform" onsubmit="saveOp(event)"><input type="hidden" name="id"><label>Prénom<input name="first" placeholder="Prénom"></label><label>Nom / raison sociale *<input name="last" required></label><label>Email<input name="email" type="email"></label><label>Téléphone<input name="phone"></label><label>Entreprise<input name="company"></label><label>Formation / prestation *<input name="training" required></label><label>Catégorie<select name="category"><option>VAE</option><option>Formation courte</option><option>Autre</option></select></label><label>Profil<select name="profile"><option>Salarié</option><option>Reconversion</option><option>Entreprise</option></select></label><label>Statut<select name="stage" id="stageInput"></select></label><label>Montant HT (€)<input name="ht" type="number" min="0" step="0.01" placeholder="Non renseigné"></label><label>TVA<select name="vat"><option value="0">0 %</option><option value="5.5">5,5 %</option><option value="10">10 %</option><option value="20">20 %</option><option value="exempt">Exonéré</option></select></label><label>Relance<input name="follow" type="date"></label><label>Clôture prévisionnelle<input name="forecast" type="date"></label><label>Clôture réelle<input name="closed" type="date"></label><label>Source<input name="source"></label><label>Responsable<input name="owner"></label><label class="wide">Notes<textarea name="notes"></textarea></label><footer><button type="button" onclick="editor.close()">Annuler</button><button type="submit" class="primary">Enregistrer</button></footer></form><section id="timeline"></section></dialog>
<script>
'use strict';const STAGES=['Nouveau','Contacté','En discussion','RDV / Proposition','Gagné','Perdu'],KEY='moon.crm.v1';let ops=[],view='dashboard';const $=id=>document.getElementById(id);const money=n=>new Intl.NumberFormat('fr-FR',{style:'currency',currency:'EUR'}).format(n||0);const today=()=>new Date().toLocaleDateString('en-CA');const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const active=o=>!['Gagné','Perdu'].includes(o.stage);const amount=o=>Number(o.ht||0)*( $('tax').value==='ttc'?(1+(o.vat==='exempt'?0:Number(o.vat||0))/100):1);const name=o=>[o.first,o.last].filter(Boolean).join(' ');const get=id=>ops.find(o=>o.id===id);
try{ops=JSON.parse(localStorage.getItem(KEY)||'[]');if(!Array.isArray(ops))ops=[]}catch{ops=[]}
function persist(){try{localStorage.setItem(KEY,JSON.stringify(ops))}catch(e){alert('Sauvegarde impossible : '+e.message)}}function notice(s){$('notice').textContent=s;setTimeout(()=>{if($('notice').textContent===s)$('notice').textContent=''},5000)}
function filtered(){let p=$('period').value;if(p==='all')return ops;let now=today(),prefix=p==='month'?now.slice(0,7):now.slice(0,4);return ops.filter(o=>(active(o)?o.forecast:o.closed||o.created||'').startsWith(prefix))}
function render(){document.querySelectorAll('.nav button').forEach(b=>b.classList.toggle('active',b.id==='nav-'+view));let a=filtered();if(view==='dashboard'){let won=a.filter(o=>o.stage==='Gagné'),lost=a.filter(o=>o.stage==='Perdu'),open=a.filter(active),sum=x=>x.reduce((s,o)=>s+amount(o),0),known=won.filter(o=>o.ht!==''&&o.ht!=null),due=ops.filter(o=>active(o)&&o.follow&&o.follow<=today()).sort((x,y)=>x.follow.localeCompare(y.follow));$('content').innerHTML='<div class="metrics">'+[['CA sécurisé',money(sum(won)),won.length+' gagnées'],['Pipeline en cours',money(sum(open)),open.length+' actives'],['Montant perdu',money(sum(lost)),lost.length+' perdues'],['Panier moyen',known.length?money(sum(known)/known.length):'—',known.length+' ventes chiffrées']].map(x=>'<div class="metric"><span>'+x[0]+'</span><strong>'+x[1]+'</strong><small>'+x[2]+'</small></div>').join('')+'</div><div class="panel" style="margin-top:20px"><h2>Relances prioritaires <span class="pill">'+due.length+'</span></h2>'+ (due.map(o=>'<div class="item"><div><b>'+safe(name(o))+'</b><br><small>'+safe(o.training)+' · '+safe(o.follow)+(o.follow<today()?' · En retard':' · Aujourd’hui')+'</small></div><button onclick="editOp('+JSON.stringify(o.id)+')">Ouvrir</button></div>').join('')||'<p class="muted">Aucune relance en attente.</p>')+'</div><div class="panel" style="margin-top:12px">Taux de conversion : <b>'+((won.length+lost.length)?Math.round(won.length/(won.length+lost.length)*100)+' %':'—')+'</b></div>';return}
if(view==='board'){$('content').innerHTML='<div class="board">'+STAGES.map(s=>'<div class="lane" data-stage="'+safe(s)+'"><h3>'+safe(s)+' <span class="pill">'+a.filter(o=>o.stage===s).length+'</span></h3>'+a.filter(o=>o.stage===s).map(o=>'<div class="op" draggable="true" data-id="'+safe(o.id)+'" onclick="editOp(this.dataset.id)" ondragstart="event.dataTransfer.setData(\'text/plain\',this.dataset.id)"><b>'+safe(name(o))+'</b><small>'+safe(o.training)+'</small><p>'+money(amount(o))+'</p><small>'+safe(o.follow||'Pas de relance')+'</small></div>').join('')+'</div>').join('')+'</div>';document.querySelectorAll('.lane').forEach(l=>{l.ondragover=e=>e.preventDefault();l.ondrop=e=>{e.preventDefault();let o=get(e.dataTransfer.getData('text/plain'));if(o){setStage(o,l.dataset.stage);persist();render()}}});return}
$('content').innerHTML='<div class="panel"><h2>Opportunités ('+a.length+')</h2><input id="search" placeholder="Rechercher une personne, entreprise ou formation" oninput="searchRows()" style="width:100%"><div id="rows">'+rows(a)+'</div></div>'}
function rows(a){return a.map(o=>'<div class="item" data-search="'+safe((name(o)+' '+o.company+' '+o.training+' '+o.email).toLowerCase())+'"><div><b>'+safe(name(o))+'</b><br><small>'+safe(o.company)+' · '+safe(o.training)+' · '+safe(o.stage)+'</small></div><div>'+money(amount(o))+' <button onclick="editOp('+JSON.stringify(o.id)+')">Ouvrir</button></div></div>').join('')||'<p class="muted">Aucune opportunité.</p>'}
function searchRows(){let q=$('search').value.toLowerCase();document.querySelectorAll('#rows .item').forEach(e=>e.hidden=!e.dataset.search.includes(q))}
function newOp(){openOp(null)}function editOp(id){openOp(get(id))}
function openOp(o){let f=$('opform');f.reset();$('stageInput').innerHTML=STAGES.map(s=>'<option>'+safe(s)+'</option>').join('');for(let e of f.elements)if(e.name)e.value=o?.[e.name]??(e.name==='stage'?'Nouveau':e.name==='vat'?'0':'');$('editTitle').textContent=o?'Modifier '+name(o):'Nouvelle opportunité';$('timeline').innerHTML=o?'<h3>Historique des échanges</h3><div style="display:flex;gap:8px;flex-wrap:wrap"><select id="channel"><option>Appel</option><option>Email</option><option>SMS</option><option>Visio</option><option>Rendez-vous</option><option>Note</option></select><input id="comment" placeholder="Commentaire"><button onclick="addEvent('+JSON.stringify(o.id)+')">Ajouter</button><button onclick="removeOp('+JSON.stringify(o.id)+')">Supprimer la fiche</button></div>'+[...(o.events||[])].reverse().map(e=>'<div class="event"><small>'+safe(new Date(e.at).toLocaleString('fr-FR'))+' · '+safe(e.channel)+'</small><div>'+safe(e.text)+'</div></div>').join(''):'<p class="muted">Enregistrez la fiche pour ajouter des échanges.</p>';$('editor').showModal()}
function setStage(o,s){if(o.stage===s)return;let old=o.stage;o.stage=s;o.events??=[];o.events.push({at:new Date().toISOString(),channel:'Statut',text:old+' → '+s});if(['Gagné','Perdu'].includes(s)){o.closed=o.closed||today();o.follow=''}else if(['Gagné','Perdu'].includes(old))o.closed=''}
function saveOp(e){e.preventDefault();let f=e.target,data=Object.fromEntries(new FormData(f).entries()),o=data.id?get(data.id):null;if(!o){o={id:crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random(),created:today(),events:[]};ops.push(o)}let s=data.stage;delete data.id;delete data.stage;Object.assign(o,data);setStage(o,s);persist();$('editor').close();render();notice('Opportunité enregistrée')}
function addEvent(id){let o=get(id),txt=$('comment').value.trim();if(!txt)return; o.events??=[];o.events.push({at:new Date().toISOString(),channel:$('channel').value,text:txt});persist();openOp(o);notice('Interaction enregistrée')}
function removeOp(id){if(!confirm('Supprimer définitivement cette opportunité ?'))return;ops=ops.filter(o=>o.id!==id);persist();$('editor').close();render()}
function exportData(){let blob=new Blob([JSON.stringify({version:1,exported:new Date().toISOString(),opportunities:ops},null,2)],{type:'application/json'}),u=URL.createObjectURL(blob),a=document.createElement('a');a.href=u;a.download='moon-sauvegarde-'+today()+'.json';a.click();URL.revokeObjectURL(u)}
async function importData(e){let file=e.target.files[0];if(!file)return;try{let d=JSON.parse(await file.text()),items=Array.isArray(d)?d:d.opportunities;if(!Array.isArray(items)||items.some(o=>!o||typeof o!=='object'||!o.id||!STAGES.includes(o.stage)))throw Error('Format incompatible');if(!confirm('Remplacer les '+ops.length+' opportunités actuelles par les '+items.length+' du fichier ?'))return;ops=items;persist();render();notice('Import terminé')}catch(err){alert('Import impossible : '+err.message)}finally{e.target.value=''}}
render();
</script></body></html>
